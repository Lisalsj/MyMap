name: Windows build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run test:e2e
      - run: npm run dist:win
      - name: Test packaged executable
        run: npx playwright test tests/e2e/app.spec.ts tests/e2e/city-map.spec.ts --output=.superpowers/packaged-results
        env:
          MYMAP_EXECUTABLE: ${{ github.workspace }}\release\win-unpacked\MyMap.exe
      - run: npm run checksums
      - uses: actions/upload-artifact@v7
        with:
          name: MyMap-Windows-x64
          path: |
            release/*.exe
            release/SHA256SUMS.txt
      - name: Publish a new tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release view $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:GITHUB_REF_NAME release/*.exe release/SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --verify-tag --title "MyMap $env:GITHUB_REF_NAME" --notes-file docs/RELEASE.md
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
