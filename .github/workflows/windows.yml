name: Windows manual build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Verify and build Windows executables
        run: npm run verify:local
      - name: Upload test failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: MyMap-test-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            test-results/reports/
            test-results/packaged/
            test-results/screenshots/
      - name: Select current verified attachments
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "MYMAP_BUILD_VERSION=$version" >> $env:GITHUB_ENV
      - uses: actions/upload-artifact@v7
        with:
          name: MyMap-Windows-x64
          compression-level: 0
          if-no-files-found: error
          path: |
            release/MyMap-${{ env.MYMAP_BUILD_VERSION }}-Setup-x64.exe
            release/MyMap-${{ env.MYMAP_BUILD_VERSION }}-Portable-x64.exe
            release/SHA256SUMS.txt
            release/latest.yml
